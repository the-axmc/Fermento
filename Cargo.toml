[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
authors = []
edition = "2021"
license = "Apache-2.0"
version = "0.0.1"

[workspace.dependencies]
# OpenZeppelin Stellar Contracts 0.8.0 (audited RC line) and the soroban-sdk it targets.
soroban-sdk = "28.0.0"
stellar-tokens = "=0.8.0"
stellar-access = "=0.8.0"
stellar-contract-utils = "=0.8.0"
stellar-macros = "=0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
